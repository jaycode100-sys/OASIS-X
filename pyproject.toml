[project]
name = "oasis-x"
version = "1.0.0"
description = "Autonomous Predictive Fault Healing for Nigerian optical fibre networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joshua Olorundami", email = "joshuaolorundami@mtu.edu.ng" }]
license = { text = "MIT" }
keywords = ["fibre", "network", "fault-healing", "nigerian", "ncc", "telecom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "fastapi>=0.100,<0.140",
    "uvicorn>=0.20,<0.45",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3,<2.0",
    "requests>=2.28,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0.1,<5.0",
    "python-multipart>=0.0.5",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/jaycode100-sys/OASIS-X"
Repository = "https://github.com/jaycode100-sys/OASIS-X.git"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "root*", "models*", "data*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "SIM", "ARG"]
ignore = ["E501", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
