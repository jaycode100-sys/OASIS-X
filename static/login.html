<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OASIS-X — Login</title>
  <meta name="description" content="Login to OASIS-X Autonomous Fibre Fault Healing System" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/oasis.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #060f1a; --bg2: #0b1a2e; --bg3: #10233d;
      --border: #1a3450; --txt: #e0edf8; --txt2: #7090b0; --txt3: #3d5a7a;
      --accent: #00ff88; --accent-dim: rgba(0,255,136,0.15);
      --red: #ef4444; --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: var(--font); }
    body { display: flex; align-items: center; justify-content: center; position: relative; }

    /* ── Animated water-like background ── */
    .bg-shapes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .bg-shapes .shape {
      position: absolute; border-radius: 50%; opacity: 0.25;
      background: var(--bg2); border: 1px solid var(--border); will-change: transform;
      pointer-events: auto; cursor: pointer;
    }
    .shape-1 {
      width: 500px; height: 500px; top: -10%; left: -8%;
      animation: drift1 22s ease-in-out infinite alternate;
      background: radial-gradient(circle at 30% 30%, var(--bg3), transparent);
      border-radius: 42% 58% 65% 35% / 48% 52% 48% 52%;
    }
    .shape-2 {
      width: 380px; height: 380px; bottom: -12%; right: -6%;
      animation: drift2 26s ease-in-out infinite alternate;
      background: radial-gradient(circle at 70% 70%, var(--bg3), transparent);
      border-radius: 55% 45% 38% 62% / 52% 58% 42% 48%;
    }
    .shape-3 {
      width: 280px; height: 280px; top: 55%; left: -5%;
      animation: drift3 20s ease-in-out infinite alternate;
      background: radial-gradient(circle at 50% 50%, var(--border), transparent);
      border-radius: 62% 38% 48% 52% / 38% 55% 45% 62%;
      opacity: 0.12;
    }
    .shape-4 {
      width: 200px; height: 200px; top: 12%; right: 8%;
      animation: drift4 18s ease-in-out infinite alternate;
      background: radial-gradient(circle at 40% 60%, rgba(0,255,136,0.06), transparent);
      border: 1px solid rgba(0,255,136,0.08);
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      opacity: 0.4;
    }
    .shape-5 {
      width: 150px; height: 150px; bottom: 30%; right: 25%;
      animation: drift5 24s ease-in-out infinite alternate;
      background: var(--bg2);
      border-radius: 67% 33% 47% 53% / 57% 44% 56% 43%;
      opacity: 0.18;
    }
    .shape-6 {
      width: 60px; height: 60px; top: 30%; left: 50%;
      animation: drift6 15s ease-in-out infinite alternate;
      background: rgba(0,255,136,0.04);
      border: 1px solid rgba(0,255,136,0.06);
      border-radius: 50%;
      opacity: 0.3;
    }

    @keyframes drift1 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 42% 58% 65% 35% / 48% 52% 48% 52%; }
      25%  { transform: translate(30px, 20px) rotate(6deg) scale(1.02); border-radius: 48% 52% 58% 42% / 52% 48% 52% 48%; }
      50%  { transform: translate(60px, 40px) rotate(12deg) scale(1.05); border-radius: 52% 48% 48% 52% / 58% 42% 58% 42%; }
      75%  { transform: translate(30px, 20px) rotate(6deg) scale(1.02); border-radius: 48% 52% 52% 48% / 48% 52% 48% 52%; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 42% 58% 65% 35% / 48% 52% 48% 52%; }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 55% 45% 38% 62% / 52% 58% 42% 48%; }
      25%  { transform: translate(-25px, -15px) rotate(-4deg) scale(1.03); border-radius: 52% 48% 42% 58% / 48% 52% 48% 52%; }
      50%  { transform: translate(-50px, -30px) rotate(-8deg) scale(1.08); border-radius: 48% 52% 48% 52% / 52% 48% 52% 48%; }
      75%  { transform: translate(-25px, -15px) rotate(-4deg) scale(1.03); border-radius: 52% 48% 45% 55% / 48% 52% 48% 52%; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 55% 45% 38% 62% / 52% 58% 42% 48%; }
    }
    @keyframes drift3 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 62% 38% 48% 52% / 38% 55% 45% 62%; }
      25%  { transform: translate(20px, -10px) rotate(7deg) scale(1.04); border-radius: 58% 42% 52% 48% / 42% 58% 42% 58%; }
      50%  { transform: translate(40px, -20px) rotate(15deg) scale(1.1); border-radius: 52% 48% 58% 42% / 48% 52% 48% 52%; }
      75%  { transform: translate(20px, -10px) rotate(7deg) scale(1.04); border-radius: 58% 42% 52% 48% / 42% 58% 42% 58%; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 62% 38% 48% 52% / 38% 55% 45% 62%; }
    }
    @keyframes drift4 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      25%  { transform: translate(-10px, 15px) rotate(-5deg) scale(1.03); border-radius: 35% 65% 65% 35% / 35% 35% 65% 65%; }
      50%  { transform: translate(-20px, 30px) rotate(-10deg) scale(1.06); border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; }
      75%  { transform: translate(-10px, 15px) rotate(-5deg) scale(1.03); border-radius: 35% 65% 65% 35% / 35% 35% 65% 65%; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
    }
    @keyframes drift5 {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 67% 33% 47% 53% / 57% 44% 56% 43%; }
      25%  { transform: translate(7px, -12px) rotate(10deg) scale(1.05); border-radius: 62% 38% 52% 48% / 52% 48% 52% 48%; }
      50%  { transform: translate(15px, -25px) rotate(20deg) scale(1.12); border-radius: 57% 43% 57% 43% / 47% 53% 47% 53%; }
      75%  { transform: translate(7px, -12px) rotate(10deg) scale(1.05); border-radius: 62% 38% 52% 48% / 52% 48% 52% 48%; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); border-radius: 67% 33% 47% 53% / 57% 44% 56% 43%; }
    }
    @keyframes drift6 {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.3; border-radius: 50%; }
      25%  { transform: translate(15px, -20px) scale(1.2); opacity: 0.25; border-radius: 45% 55% 55% 45% / 55% 45% 55% 45%; }
      50%  { transform: translate(30px, -40px) scale(1.5); opacity: 0.1; border-radius: 40% 60% 60% 40% / 60% 40% 60% 40%; }
      75%  { transform: translate(15px, -20px) scale(1.2); opacity: 0.25; border-radius: 45% 55% 55% 45% / 55% 45% 55% 45%; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.3; border-radius: 50%; }
    }

    /* ── Disintegration particles ── */
    .particle {
      position: fixed; border-radius: 50%; pointer-events: none;
      z-index: 0; will-change: transform, opacity;
      animation: particleBurst 0.9s ease-out forwards;
    }
    @keyframes particleBurst {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
      100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
    }

    .login-wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 24px; }
    .login-card {
      background: rgba(11,26,46,0.85); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 40px 32px 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; inset: -2px;
      background: conic-gradient(from 0deg, #00ff88, #3b82f6, #f59e0b, #00ff88);
      border-radius: 18px; z-index: -1; opacity: 0.5;
      animation: borderGlow 4s linear infinite;
    }
    @keyframes borderGlow {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .login-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .login-logo img { width: 42px; height: 42px; position: relative; }
    .login-logo img.loading {
      animation: logoBrighten 1.5s ease-in-out infinite;
    }
    @keyframes logoBrighten {
      0%   { filter: brightness(0.4) saturate(0.5); }
      50%  { filter: brightness(1.2) saturate(1.2); }
      100% { filter: brightness(0.4) saturate(0.5); }
    }
    .login-logo-text .title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .login-logo-text .sub { font-size: 12px; color: var(--txt2); }
    .login-title { font-size: 14px; font-weight: 600; color: var(--txt2); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--txt2); margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(16,35,61,0.7); color: var(--txt); font-size: 14px; font-family: var(--font);
      outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: var(--accent); color: #060f1a; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: var(--font); transition: opacity 0.2s; margin-top: 8px;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .login-error { color: var(--red); font-size: 13px; margin-bottom: 8px; text-align: center; display: none; }
    .login-error.show { display: block; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--txt3); }
    .login-spinner { display: none; vertical-align: middle; margin-right: 6px; }
    .login-btn.loading .login-spinner { display: inline-block; }
    .login-btn.loading .login-text { opacity: 0.6; }
    .back-to-landing {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      padding: 8px 16px; border-radius: 8px;
      background: rgba(11,26,46,0.8); backdrop-filter: blur(8px);
      border: 1px solid var(--border); color: var(--txt2);
      font-size: 13px; font-weight: 500; text-decoration: none;
      transition: all .2s; font-family: var(--font);
    }
    .back-to-landing:hover { color: var(--accent); border-color: var(--accent); background: rgba(var(--accent-rgb),.08); }
    @media (max-width: 480px) {
      .login-wrap { padding: 16px; max-height: 100vh; overflow-y: auto; }
      .login-card { padding: 28px 20px 24px; max-height: none; }
      .login-logo img { width: 36px; height: 36px; }
      .login-logo-text .title { font-size: 17px; }
      .login-logo-text .sub { font-size: 11px; }
      .form-group input { padding: 9px 12px; font-size: 13px; }
      .login-btn { padding: 11px; font-size: 14px; }
      .shape-1 { width: 300px; height: 300px; }
      .shape-2 { width: 250px; height: 250px; }
      .shape-3 { width: 180px; height: 180px; }
      .shape-4 { width: 140px; height: 140px; }
      .shape-5 { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
    <div class="shape shape-6"></div>
  </div>
  <a href="/" class="back-to-landing" title="Back to Home">← Home</a>
  <div class="login-wrap">
    <div class="login-card">
      <a href="/" class="login-logo" style="text-decoration:none">
        <img src="/static/oasis.png" alt="OASIS-X" />
        <div class="login-logo-text">
          <div class="title">OASIS-X</div>
          <div class="sub">Autonomous Fibre Fault Healing System</div>
        </div>
      </a>
      <div class="login-title">Sign in</div>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="login-btn" id="login-btn">
          <span class="login-spinner">⏳</span>
          <span class="login-text">Sign In</span>
        </button>
      </form>
      <div class="login-footer">
        Don't have an account? <a href="/static/signup.html" style="color:var(--accent);text-decoration:none;">Create one</a>
      </div>
      <div class="login-footer" style="margin-top:6px;">
        <a href="#" id="forgot-password-link" style="color:var(--accent);text-decoration:none;">Forgot password?</a>
      </div>
      <div class="login-footer" style="margin-top:6px;">SWIFT FHS v1.0 &mdash; powered by Swift Solutions</div>
    </div>
  </div>
  <!-- Forgot Password Modal -->
  <div id="forgot-modal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:400px;width:90%;position:relative;">
      <button onclick="document.getElementById('forgot-modal').style.display='none'" style="position:absolute;top:12px;right:12px;background:none;border:none;color:var(--txt2);font-size:18px;cursor:pointer;">✕</button>
      <h3 style="font-size:18px;font-weight:700;color:var(--txt);margin-bottom:8px;">Reset Password</h3>
      <p style="font-size:13px;color:var(--txt2);margin-bottom:20px;">Enter your email address and we'll send you a link to reset your password.</p>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:12px;font-weight:500;color:var(--txt2);margin-bottom:6px;">Email Address</label>
        <input type="email" id="forgot-email" placeholder="Enter your email" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(16,35,61,0.7);color:var(--txt);font-size:14px;font-family:var(--font);outline:none;" />
      </div>
      <div id="forgot-message" style="font-size:13px;margin-bottom:12px;display:none;"></div>
      <button onclick="handleForgotPassword()" style="width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#060f1a;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);">Send Reset Link</button>
    </div>
  </div>
  <script>
    /* ── Forgot Password ── */
    document.getElementById('forgot-password-link')?.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('forgot-modal').style.display = 'flex';
    });

    async function handleForgotPassword() {
      const email = document.getElementById('forgot-email').value.trim();
      const msg = document.getElementById('forgot-message');
      if (!email) {
        msg.textContent = 'Please enter your email address';
        msg.style.color = 'var(--red)';
        msg.style.display = 'block';
        return;
      }
      // For demo purposes, show a success message
      msg.textContent = 'If an account exists with this email, a password reset link has been sent. Check your inbox.';
      msg.style.color = 'var(--accent)';
      msg.style.display = 'block';
      setTimeout(() => {
        document.getElementById('forgot-modal').style.display = 'none';
        msg.style.display = 'none';
      }, 3000);
    }
  </script>
  <script>
    /* ── Interactive water-like blobs ── */
    const shapes = document.querySelectorAll('.bg-shapes .shape');
    const container = document.querySelector('.bg-shapes');
    const state = [];

    shapes.forEach((el, i) => {
      const cs = getComputedStyle(el);
      state[i] = {
        baseOpacity: parseFloat(cs.opacity),
        br: cs.borderRadius,
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
      };
    });

    let rafId = null;
    let mouseX = 0, mouseY = 0;
    let lastMouseMove = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      lastMouseMove = Date.now();
    });

    function animate() {
      const now = Date.now();
      const timeSinceMove = now - lastMouseMove;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      shapes.forEach((el, i) => {
        const s = state[i];
        const f = 6 + i * 3;
        const rect = el.getBoundingClientRect();
        const ecx = rect.left + rect.width / 2;
        const ecy = rect.top + rect.height / 2;
        const dist = Math.hypot(mouseX - ecx, mouseY - ecy);
        const close = Math.max(0, 1 - dist / 250);

        // Water-like physics: gentle drift + mouse influence
        const dx = (mouseX - cx) / cx;
        const dy = (mouseY - cy) / cy;
        const targetX = dx * f + close * (Math.random() - 0.5) * 15;
        const targetY = dy * f + close * (Math.random() - 0.5) * 15;

        // Smooth spring physics for fluid motion
        s.vx += (targetX - s.x) * 0.02;
        s.vy += (targetY - s.y) * 0.02;
        s.vx *= 0.92; // damping
        s.vy *= 0.92;
        s.x += s.vx;
        s.y += s.vy;

        // Water-like border radius morphing
        const br = [
          [42,58,65,35,48,52,48,52], [55,45,38,62,52,58,42,48],
          [62,38,48,52,38,55,45,62], [30,70,70,30,30,30,70,70],
          [67,33,47,53,57,44,56,43], [50,50,50,50,50,50,50,50]
        ][i];
        const lerp = (a, b, t) => a + (b - a) * t;
        const wave = Math.sin(now / 1000 + i) * 0.5 + 0.5;
        const br1 = br.slice(0,4).map((v, idx) => lerp(v, 50 - idx * 3 + wave * 10, close * 0.3) + '%').join(' ');
        const br2 = br.slice(4).map((v, idx) => lerp(v, 50 + idx * 2 + wave * 10, close * 0.3) + '%').join(' ');

        el.style.transform = `translate(${s.x}px, ${s.y}px)`;
        el.style.borderRadius = br1 + ' / ' + br2;
        el.style.opacity = Math.min(1, s.baseOpacity + close * 0.3);
      });

      rafId = requestAnimationFrame(animate);
    }
    animate();

    container.addEventListener('click', (e) => {
      const target = e.target.closest('.shape');
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const color = getComputedStyle(target).background;
      target.style.transition = 'opacity 0.3s';
      target.style.opacity = '0';
      setTimeout(() => target.remove(), 300);
      for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 4 + Math.random() * 24;
        const angle = Math.random() * 2 * Math.PI;
        const dist = 80 + Math.random() * 350;
        p.style.cssText = `
          left:${cx - size/2}px; top:${cy - size/2}px;
          width:${size}px; height:${size}px;
          background:${color};
          --px:${Math.cos(angle) * dist}px; --py:${Math.sin(angle) * dist}px;
          border: 1px solid rgba(0,255,136,0.15);
        `;
        container.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      const logo = document.querySelector('.login-logo img');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { err.textContent = 'Please enter username and password'; err.classList.add('show'); return; }
      btn.classList.add('loading');
      btn.disabled = true;
      logo.classList.add('loading');
      err.classList.remove('show');
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await r.json();
        if (!r.ok) { err.textContent = data.detail || 'Login failed'; err.classList.add('show'); return; }
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('_login_ts', String(Date.now()));
        window.location.href = '/dashboard';
      } catch (e) {
        err.textContent = 'Connection error. Is the server running?';
        err.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
        logo.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
