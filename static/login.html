<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OASIS-X — Login</title>
  <meta name="description" content="Login to OASIS-X Autonomous Fibre Fault Healing System" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/oasis.png" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #030a12;
      --bg-card: rgba(8, 20, 32, 0.8);
      --accent: #00ff88;
      --blue: #3b82f6;
      --cyan: #22d3ee;
      --purple: #a855f7;
      --txt: #e8f0f8;
      --txt2: #6b8aa8;
      --txt3: #3d5a7a;
      --border: rgba(255, 255, 255, 0.08);
      --red: #ef4444;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: var(--font-body);
      overflow-y: auto;
      line-height: 1.6;
    }

    /* ── Canvas background ── */
    #fibreCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Animated grid ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
    }

    @keyframes gridDrift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    /* ── Glowing orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(100px);
      opacity: 0.12;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; left: -100px;
      animation: orbFloat1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: var(--blue);
      bottom: -150px; right: -100px;
      animation: orbFloat2 22s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 400px; height: 400px;
      background: var(--purple);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: orbFloat3 15s ease-in-out infinite alternate;
    }

    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(80px, 60px) scale(1.1); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-60px, -80px) scale(1.15); }
    }
    @keyframes orbFloat3 {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-40%, -60%) scale(1.2); }
    }

    /* ── Back button ── */
    .back-home {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(8, 20, 32, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--txt2);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      font-family: var(--font-body);
      transition: all 0.2s ease;
    }
    .back-home:hover {
      color: var(--accent);
      border-color: rgba(0, 255, 136, 0.3);
      background: rgba(0, 255, 136, 0.06);
    }

    /* ── Login wrapper ── */
    .login-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    /* ── Login card ── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      transition: box-shadow 0.3s ease;
    }
    .login-card:hover {
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.08);
    }

    /* ── Logo ── */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
      text-decoration: none;
    }
    .login-logo img {
      width: 44px;
      height: 44px;
    }
    .login-logo-text {
      display: flex;
      flex-direction: column;
    }
    .login-logo-text .title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--txt);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .login-logo-text .sub {
      font-size: 12px;
      color: var(--txt2);
      line-height: 1.3;
    }

    /* ── Terminal prefix ── */
    .terminal-prefix {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 24px 0 6px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      opacity: 0.8;
    }
    .terminal-prefix .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--accent);
      animation: blink 1s step-end infinite;
      opacity: 0.7;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── Heading ── */
    .login-heading {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--txt);
      margin-bottom: 28px;
      letter-spacing: -0.3px;
    }

    /* ── Form groups ── */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--txt2);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(3, 10, 18, 0.6);
      color: var(--txt);
      font-size: 14px;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .form-group input::placeholder {
      color: var(--txt3);
    }
    .form-group input:focus {
      border-color: rgba(0, 255, 136, 0.4);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.06);
    }

    /* ── Password toggle ── */
    .toggle-pw {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--txt3);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-pw:hover {
      color: var(--txt2);
    }
    .toggle-pw svg {
      width: 18px;
      height: 18px;
    }

    /* ── Remember / Forgot row ── */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .form-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--txt2);
      cursor: pointer;
      user-select: none;
    }
    .form-options input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .form-options a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .form-options a:hover {
      opacity: 0.8;
    }

    /* ── Submit button ── */
    .login-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #030a12;
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
      letter-spacing: 0.2px;
    }
    .login-btn:hover {
      opacity: 0.9;
    }
    .login-btn:active {
      transform: scale(0.985);
    }
    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Error message ── */
    .login-error {
      color: var(--red);
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
    }
    .login-error.show {
      display: block;
    }

    /* ── Footer links ── */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--txt2);
    }
    .login-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .login-footer a:hover {
      opacity: 0.8;
    }
    .login-bottom-link {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
    }
    .login-bottom-link a {
      color: var(--txt3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-bottom-link a:hover {
      color: var(--txt2);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-wrap {
        padding: 24px 16px;
        align-items: flex-start;
        padding-top: 60px;
      }
      .login-card {
        padding: 32px 20px 28px;
        border-radius: 16px;
      }
      .login-logo img {
        width: 36px;
        height: 36px;
      }
      .login-logo-text .title {
        font-size: 18px;
      }
      .login-heading {
        font-size: 18px;
      }
      .form-group input {
        padding: 10px 12px;
        font-size: 13px;
      }
      .login-btn {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <canvas id="fibreCanvas"></canvas>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Back button -->
  <a href="/" class="back-home">&larr; Home</a>

  <!-- Login card -->
  <div class="login-wrap">
    <div class="login-card">

      <a href="/" class="login-logo">
        <img src="/static/oasis.png" alt="OASIS-X" />
        <div class="login-logo-text">
          <div class="title">OASIS-X</div>
          <div class="sub">Autonomous Fibre Fault Healing System</div>
        </div>
      </a>

      <div class="terminal-prefix">
        <span>oasis@x:~$</span>
        <span class="cursor"></span>
      </div>

      <h1 class="login-heading">Sign in to your account</h1>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <a href="#" id="forgot-password-link">Forgot password?</a>
        </div>

        <div class="login-error" id="login-error"></div>

        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="/signup">Sign up</a>
      </div>
      <div class="login-bottom-link">
        <a href="/">Back to home</a>
      </div>

    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;">
    <div style="background:rgba(8,20,32,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px;max-width:400px;width:90%;position:relative;backdrop-filter:blur(20px);">
      <button onclick="document.getElementById('forgot-modal').style.display='none'" style="position:absolute;top:12px;right:12px;background:none;border:none;color:#6b8aa8;font-size:18px;cursor:pointer;transition:color 0.2s;" onmouseover="this.style.color='#e8f0f8'" onmouseout="this.style.color='#6b8aa8'">&#10005;</button>
      <h3 style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#e8f0f8;margin-bottom:8px;">Reset Password</h3>
      <p style="font-size:13px;color:#6b8aa8;margin-bottom:20px;">Enter your email address and we'll send you a link to reset your password.</p>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:12px;font-weight:500;color:#6b8aa8;margin-bottom:6px;">Email Address</label>
        <input type="email" id="forgot-email" placeholder="Enter your email" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(3,10,18,0.6);color:#e8f0f8;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;" onfocus="this.style.borderColor='rgba(0,255,136,0.4)'" onblur="this.style.borderColor='rgba(255,255,255,0.08)'" />
      </div>
      <div id="forgot-message" style="font-size:13px;margin-bottom:12px;display:none;"></div>
      <button onclick="handleForgotPassword()" style="width:100%;padding:12px;border-radius:10px;border:none;background:#00ff88;color:#030a12;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">Send Reset Link</button>
    </div>
  </div>

  <script>
    /* ── Canvas fibre-optic particles ── */
    (function() {
      const canvas = document.getElementById('fibreCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const DOTS = 18;
      const dots = [];

      for (let i = 0; i < DOTS; i++) {
        dots.push({
          x: Math.random() * (w || window.innerWidth),
          y: Math.random() * (h || window.innerHeight),
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.15 - 0.1,
          r: Math.random() * 1.5 + 0.8,
          alpha: Math.random() * 0.25 + 0.08,
          color: Math.random() > 0.3
            ? `rgba(0, 255, 136, ALPHA)`
            : `rgba(59, 130, 246, ALPHA)`,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);

        for (const d of dots) {
          d.x += d.vx;
          d.y += d.vy;

          if (d.x < -10) d.x = w + 10;
          if (d.x > w + 10) d.x = -10;
          if (d.y < -10) d.y = h + 10;
          if (d.y > h + 10) d.y = -10;

          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = d.color.replace('ALPHA', d.alpha);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── Password show/hide toggle ── */
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePw');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    toggleBtn.addEventListener('click', function() {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      eyeOpen.style.display = isPassword ? 'none' : 'block';
      eyeClosed.style.display = isPassword ? 'block' : 'none';
    });

    /* ── Forgot Password modal ── */
    document.getElementById('forgot-password-link').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('forgot-modal').style.display = 'flex';
    });

    document.getElementById('forgot-modal').addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });

    function handleForgotPassword() {
      const email = document.getElementById('forgot-email').value.trim();
      const msg = document.getElementById('forgot-message');
      if (!email) {
        msg.textContent = 'Please enter your email address.';
        msg.style.color = '#ef4444';
        msg.style.display = 'block';
        return;
      }
      msg.textContent = 'If an account exists with this email, a password reset link has been sent.';
      msg.style.color = '#00ff88';
      msg.style.display = 'block';
      setTimeout(function() {
        document.getElementById('forgot-modal').style.display = 'none';
        msg.style.display = 'none';
        document.getElementById('forgot-email').value = '';
      }, 3000);
    }

    /* ── Login form submission ── */
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        err.textContent = 'Please enter both username and password.';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      err.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password }),
        });

        const data = await res.json();

        if (!res.ok) {
          err.textContent = data.detail || 'Login failed. Please check your credentials.';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        localStorage.setItem('token', data.access_token);
        window.location.href = '/dashboard';
      } catch (error) {
        err.textContent = 'Connection error. Is the server running?';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
  <script src="/static/transition.js"></script>
</body>
</html>
