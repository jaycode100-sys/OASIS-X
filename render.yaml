services:
  - type: web
    name: oasis-x
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start_server.py
    envVars:
      - key: OASIS_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
