services:
  - type: web
    name: oasis-x
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start_server.py
    envVars:
      - key: OASIS_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: "3.11"
